name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Package (pub get / format / analyze / test)
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test example/lib example/test
          flutter analyze
          flutter test
      - name: Publish dry-run (before the example modifies its lockfile)
        run: flutter pub publish --dry-run
      - name: Example (pub get / analyze / test)
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test
